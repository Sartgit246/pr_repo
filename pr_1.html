<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>
</head>
<style>
body
{
margin: 0;
font-family: Arial;
display: flex;
}
.sidebar
{
width: auto;
background-color: #333;
color: aqua;
padding: 15px;
}
.main
{
flex: 1;
padding: 15px;
}
.cards
{
display:grid;
grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
gap: 10px;
}
.card
{
background:#eee;
padding:15px;
text-align:center;
}
table
{
width: 100%;
margin-top: 15px;
border-collapse: collapse;
}
th,td
{
border: 1px solid #000;
padding: 8px;
}
@media(max-width:600px)
{
.sidebar
{
display: none;
}
body
{
flex-direction: column;
}
}
</style>
<body>
<div class="sidebar">
<h3>Admin</h3>
<p>Dashboard</p>
<p>Student</p>
<p>Exam</p>
<p>Result</p>
</div>
<div class="main">
<div class="cards">
<div class="card">Student:1000</div>
<div class="card">Exam:50</div>
<div class="card">Result:40</div>
</div>
<table>
<tr><th>Name</th><th>Subject</th><th>Marks</th></tr>
<tr><td>Vikas</td><td>dsa</td><td>80</td></tr>
<tr><td>Swaraj</td><td>dsa</td><td>89</td></tr>
<tr><td>Sarthak</td><td>dsa</td><td>90</td></tr>
</table>
</div>
</body>
</html>
