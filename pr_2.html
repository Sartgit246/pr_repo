<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<script>
function validateForm(){
var fname = document.getElementById("fname").value;
var lname = document.getElementById("lname").value;
var pass = document.getElementById("pass").value;
var email = document.getElementById("email").value;
var mobile = document.getElementById("mobile").value;
var address = document.getElementById("address").value;
var namePattern = /^[A-Za-z]+$/;
if(fname.length < 6 || !namePattern.test(fname)){
alert("First Name must be alphabets and at least 6 characters");
return false;
}
if(lname == ""){
alert("Last Name cannot be empty");
return false;
}
if(pass.length < 6){
alert("Password must be at least 6 characters");
return false;
}
var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(!emailPattern.test(email)){
alert("Enter valid Email");
return false;
}
var mobilePattern = /^[0-9]{10}$/;
if(!mobilePattern.test(mobile)){
alert("Mobile number must be 10 digits");
return false;
}
// Address
if(address == ""){
alert("Address cannot be empty");
return false;
}
alert("Form Submitted Successfully");
return true;
}
</script>
</head>
<body>
<h2>Registration Form</h2>
<form onsubmit="return validateForm()">
First Name: <input type="text" id="fname"><br><br>
Last Name: <input type="text" id="lname"><br><br>
Password: <input type="password" id="pass"><br><br>
Email: <input type="text" id="email"><br><br>
Mobile: <input type="text" id="mobile"><br><br>
Address: <textarea id="address"></textarea><br><br>
<input type="submit" value="Register">
</form>
</body>
</html>
