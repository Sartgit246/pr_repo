<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body
    {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    }
    .sidebar
    {
        width: auto;
        background: #000;
        color: aqua;
        padding: 15px;
    }
    .main
    {
        flex: 1;
        padding: 15px;
    }
    .cards
    {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
        gap: 10px;
    }
    .card
    {
        padding: 15px;
        background: #bfbfbf;
        text-align: center;
    }
    table
    {
        width: 100%;
        margin-top: 15px;
        border-collapse: collapse;
    }
    th,td
    {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
    }
</style>
<body>
    <div class="sidebar">
        <h3>Admin</h3>
        <p>Dashboard</p>
        <p>Students</p>
        <p>Exams</p>
        <p>Result</p>
    </div>
    <div class="main">
        <div class="cards">
            <div class="card">Students = 1000</div>
            <div class="card">Exams = 50</div>
            <div class="card">Result = 60%</div>
        </div>
        <table>
            <tr><th>Students</th><th>Subjects</th><th>Marks</th></tr>
            <tr><td>Sarthak</td><td>Dsa</td><td>89</td></tr>
            <tr><td>Mahesh</td><td>M3</td><td>90</td></tr>
            <tr><td>Swaraj</td><td>Wad</td><td>99</td></tr>
        </table>
    </div>
</body>
</html>
